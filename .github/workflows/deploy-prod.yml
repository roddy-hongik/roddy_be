name: Deploy production backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        working-directory: roddy
        run: sh gradlew bootJar --no-daemon -x test

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          test -n "$EC2_HOST"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" \
            'cd ~/roddy_be && git pull --ff-only origin main && sudo docker compose -f docker-compose.prod.yml up -d --build'

      - name: Check HTTPS health
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://api.roddy2.site/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

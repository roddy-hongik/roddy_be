# 로디 백엔드를 한 번에 띄운다.
#
#   docker login ghcr.io   (AI 서버 이미지가 비공개라 처음 한 번. read:packages 권한 토큰으로 로그인)
#   cp .env.example .env   (값을 채운 뒤)
#   docker compose pull ai   (AI 서버 최신 이미지를 받는다)
#   docker compose up --build
#
# AI 서버는 외부로 포트를 열지 않는다. 백엔드만 내부 네트워크로 부른다.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-roddy}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 백엔드가 DB 보다 먼저 떠서 죽는 일을 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 기술 그래프. 기술 노드와 기술 사이의 관계를 둔다.
  neo4j:
    image: neo4j:5-community
    environment:
      # Neo4j 5 는 비밀번호가 8자 이상이어야 뜬다.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-roddy-neo4j}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # AI 서버 코드는 roddy-hongik/roddy_ai 레포가 원본이다. 그 레포가 main 에 코드가 들어올 때마다 GHCR 에 올리는 이미지를 받아 띄운다.
  # 특정 버전으로 고정하려면 RODDY_AI_IMAGE 에 sha-<커밋 7자리> 태그를 준다.
  ai:
    image: ${RODDY_AI_IMAGE:-ghcr.io/roddy-hongik/roddy_ai:latest}
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 없어도 돌지만, 없으면 깃허브 공개 API 가 시간당 60회로 묶인다.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./roddy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-roddy}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 같은 네트워크 안의 서비스 이름으로 부른다.
      APP_AI_BASE_URL: http://ai:8000
      APP_AI_INTERNAL_SECRET: ${INTERNAL_API_SECRET}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-roddy-neo4j}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-roddy-dev-bucket}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 실제 채용 사이트로 요청이 나가므로 켤 때만 켠다.
      CRAWLER_SCHEDULER_ENABLED: ${CRAWLER_SCHEDULER_ENABLED:-false}
    ports:
      - "${BE_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ai:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  neo4j-data:

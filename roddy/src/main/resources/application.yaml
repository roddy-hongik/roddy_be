spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 커뮤니티 글 이미지 업로드. 기본값(파일당 1MB)이면 휴대폰 사진 대부분이 막힌다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}
      # 컨트롤러 인자를 만들 때 파싱해야 용량 초과가 ExceptionAdvice 로 와서 ApiResponse 로 응답된다.
      resolve-lazily: true
  # 개발 환경 기본값. 운영 환경에서는 application-prod.yaml의 필수 환경변수를 사용한다.
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
    # 그래프가 떠 있지 않아도 수집이나 어드민 요청이 오래 붙잡히지 않도록 짧게 기다린다.
    connection-timeout: 5s
    pool:
      connection-acquisition-timeout: 5s
app:
  ai:
    # 개발 환경 기본값. 운영 환경에서는 application-prod.yaml의 필수 환경변수를 사용한다.
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    internal-secret: ${APP_AI_INTERNAL_SECRET:roddy-local-internal-secret}
  crawler:
    scheduler:
      # 실제 채용 사이트로 요청이 나가므로 기본값은 꺼짐. 운영에서 의도적으로 켠다.
      enabled: ${CRAWLER_SCHEDULER_ENABLED:false}
      cron: ${CRAWLER_SCHEDULER_CRON:0 0 4 * * *}

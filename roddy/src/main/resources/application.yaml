spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


app:
  ai:
    # 같은 도커 네트워크 안의 AI 서버. 로컬에서 따로 띄울 때는 localhost 로 덮어쓴다.
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    internal-secret: ${APP_AI_INTERNAL_SECRET:roddy-local-internal-secret}
  crawler:
    scheduler:
      # 실제 채용 사이트로 요청이 나가므로 기본값은 꺼짐. 운영에서 의도적으로 켠다.
      enabled: ${CRAWLER_SCHEDULER_ENABLED:false}
      cron: ${CRAWLER_SCHEDULER_CRON:0 0 4 * * *}

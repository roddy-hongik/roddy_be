# 채용공고 본문에서 찾아낼 기술스택 사전.
#
# name    : 저장하고 화면에 보여줄 이름
# category: 기술 그래프 노드의 분류 (language, backend, frontend, mobile, database, data, infra, collaboration)
# aliases : 본문에 등장할 수 있는 다른 표기 (한글 표기, 줄임말, 옛 이름)
#
# 긴 표기부터 먼저 찾고 찾은 자리는 가려서, 짧은 표기가 겹쳐 잡히지 않게 한다.
# (예: "자바스크립트" 를 먼저 찾으므로 그 안의 "자바" 는 Java 로 잡히지 않는다)
